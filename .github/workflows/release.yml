name: Release

# Stealth-friendly trigger model.
#
# Nothing is ever published by accident:
#   - pushing a branch  -> ci.yml only (verify, no artifacts)
#   - pushing a v* tag  -> this workflow builds all platforms and uploads the
#                          installers as *run artifacts*; no GitHub Release
#   - manual dispatch   -> same as a tag push, plus an opt-in checkbox to also
#                          create a DRAFT release (drafts are not public; they
#                          still need an explicit Publish click to go live)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create a draft GitHub Release (stays unpublished until you click Publish)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which breaks the Unix tooling used
    # below (ls, line continuations). bash ships on all three runner images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron-builder needs these only on Linux (AppImage/deb packaging tools
      # shell out to them). macOS/Windows runners need nothing extra.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm libarchive-tools

      # Packaging consumes dist/, so it must exist before electron-builder runs.
      # (This step was once missing and produced a confusing
      # "entry file was not found in this archive" failure.)
      - name: Build app bundle
        run: npm run build
        env:
          APP_REPO: ${{ github.repository }}
          # Only tags carry a meaningful version; otherwise fall back to the
          # version in package.json (build-main.mjs treats "" as unset).
          APP_VERSION: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      # Fail fast with an obvious message instead of an asar sanity-check error.
      - name: Verify bundle before packaging
        run: |
          node -e '
            const fs = require("fs");
            const required = [
              "dist/main/index.js",
              "dist/preload/index.js",
              "dist/renderer/index.html"
            ];
            const missing = required.filter((f) => !fs.existsSync(f));
            if (missing.length > 0) {
              console.error("::error::bundle incomplete, missing: " + missing.join(", "));
              process.exit(1);
            }
            console.log("bundle ok: " + required.join(", "));
          '

      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Builds are unsigned by design; make that explicit so a missing
          # certificate never silently changes the output.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        run: ls -lh release/

      # Makes it obvious from the run page what was produced and where it goes.
      # Pure node so it behaves identically on every OS and shell.
      - name: Add artifact list to job summary
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "release";
            const rows = fs.readdirSync(dir)
              .map((name) => ({ name, full: path.join(dir, name) }))
              .filter((r) => fs.statSync(r.full).isFile())
              .map((r) => ({ name: r.name, size: fs.statSync(r.full).size }))
              .sort((a, b) => b.size - a.size);
            const mb = (n) => (n / 1024 / 1024).toFixed(1) + " MB";
            const lines = [
              "## Artifacts - ${{ matrix.platform }}", "",
              ...rows.map((r) => "- `" + r.name + "` (" + mb(r.size) + ")"),
              "",
              "Download these from **Artifacts** on this run. Nothing is published",
              "unless the *publish* job runs (opt-in checkbox on manual dispatch).", ""
            ];
            const text = lines.join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            console.log(text);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft release (opt-in)
    needs: build
    runs-on: ubuntu-latest
    # Explicit opt-in only. A tag push produces artifacts but no release.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create DRAFT GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_ID}"; fi
          gh release create "$TAG" \
            --title "IPATool GUI ${TAG}" \
            --draft \
            --notes "Installers for Windows (NSIS + portable), macOS (dmg, unsigned) and Linux (AppImage, deb).

          Builds are **unsigned**: on macOS right-click → Open the first time; on Windows accept the SmartScreen prompt.

          The app itself downloads and verifies [ipatool](https://github.com/majd/ipatool) on first launch - it is not bundled.

          This release was created as a **draft** and is not public." \
            artifacts/*
