name: Release

# Stealth-friendly trigger model.
#
# Nothing is ever PUBLIC by accident:
#   - pushing a branch  -> ci.yml only (verify, no artifacts)
#   - pushing a v* tag  -> builds every platform/arch combination, uploads each
#                          as its OWN run artifact, and creates a DRAFT release
#                          whose assets are the raw files (no zip wrapper)
#   - manual dispatch   -> same, with an opt-in checkbox for the draft release
#
# Why the draft release exists at all: GitHub Actions *artifacts* are always
# delivered as a zip container - that is platform behaviour we cannot change.
# Release assets, by contrast, are served as-is. A draft is invisible to anyone
# without repo write access and never appears in the public release feed; it
# only becomes public when someone clicks Publish.
#
# Artifacts are uploaded per (platform, arch) on purpose: fetching the Linux
# x64 package must not drag the arm64 one (or any other platform) along with it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create a draft GitHub Release (stays unpublished until you click Publish)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            flag: '--x64'
            extra: ''
            label: 'Windows x64'
          # CI builds the unpacked .app (dir target) and tars it into a runnable
          # package: GitHub macOS runners cannot run `hdiutil attach`
          # ("Device not configured"), which the dmg target requires.
          # A local `npm run dist:mac` on a real Mac still produces the dmg.
          - os: macos-14
            platform: mac
            arch: x64
            flag: '--x64'
            extra: '-c.mac.target=dir'
            label: 'macOS x64'
          - os: macos-14
            platform: mac
            arch: arm64
            flag: '--arm64'
            extra: '-c.mac.target=dir'
            label: 'macOS arm64'
          # Linux ships two architectures as two jobs. The arch MUST come from
          # `--x64` / `--arm64`: a target name cannot carry it (`--linux
          # AppImage:x64` is rejected as an unknown argument - the array option
          # stops at the next `--flag`, so the tokens never reach it).
          #
          # For that flag to mean anything, electron-builder.yml's linux.target
          # lists no arch - while it did, `--x64` was silently ignored and every
          # job built both (computeArchToTargetNamesMap() only consults the CLI
          # for target names it invents itself, and otherwise expands the arch
          # list from the config), which is how the arm64 package ended up
          # inside the x64 artifact.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            flag: '--x64'
            extra: ''
            label: 'Linux x64'
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
            flag: '--arm64'
            extra: ''
            label: 'Linux arm64'
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which breaks the Unix tooling used
    # below (ls, line continuations). bash ships on all three runner images.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron-builder needs these only on Linux (AppImage/deb packaging tools
      # shell out to them). macOS/Windows runners need nothing extra.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg rpm libarchive-tools

      # Packaging consumes dist/, so it must exist before electron-builder runs.
      - name: Build app bundle
        run: npm run build
        env:
          APP_REPO: ${{ github.repository }}
          APP_VERSION: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      # Fail fast with an obvious message instead of an asar sanity-check error.
      - name: Verify bundle before packaging
        run: |
          node -e '
            const fs = require("fs");
            const required = [
              "dist/main/index.js",
              "dist/preload/index.js",
              "dist/renderer/index.html"
            ];
            const missing = required.filter((f) => !fs.existsSync(f));
            if (missing.length > 0) {
              console.error("::error::bundle incomplete, missing: " + missing.join(", "));
              process.exit(1);
            }
            console.log("bundle ok: " + required.join(", "));
          '

      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.flag }} ${{ matrix.extra }} --publish never
        env:
          # Builds are unsigned by design; make that explicit so a missing
          # certificate never silently changes the output.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # macOS: turn the unpacked .app into a single runnable archive.
      - name: Package the .app as a runnable tar.gz
        if: matrix.platform == 'mac'
        run: |
          APP_DIR="$(find release -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::electron-builder produced no .app directory"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          OUT="release/ipatool-gui-${VERSION}-mac-${{ matrix.arch }}.app.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          echo "packaged $OUT from $APP_DIR"

      - name: List artifacts
        run: ls -lh release/

      # Pure node so it behaves identically on every OS and shell.
      - name: Add artifact list to job summary
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "release";
            const rows = fs.readdirSync(dir)
              .map((name) => ({ name, full: path.join(dir, name) }))
              .filter((r) => fs.statSync(r.full).isFile())
              .map((r) => ({ name: r.name, size: fs.statSync(r.full).size }))
              .sort((a, b) => b.size - a.size);
            const mb = (n) => (n / 1024 / 1024).toFixed(1) + " MB";
            const lines = [
              "## Artifacts - ${{ matrix.label }}", "",
              ...rows.map((r) => "- `" + r.name + "` (" + mb(r.size) + ")"),
              "",
              "Download **release-${{ matrix.platform }}-${{ matrix.arch }}** from",
              "Artifacts on this run - each platform/arch is uploaded separately.",
              ""
            ];
            const text = lines.join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            console.log(text);
          '

      - uses: actions/upload-artifact@v4
        with:
          # One artifact per platform+arch so a single package can be fetched
          # without downloading unrelated builds.
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.app.tar.gz
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create DRAFT release (raw assets, hidden until published)
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes get a draft automatically (raw, unzipped downloads for the team);
    # dispatches only when the checkbox is ticked. Drafts are not public.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create DRAFT GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_ID}"; fi
          gh release create "$TAG" \
            --title "IPATool GUI ${TAG}" \
            --draft \
            --notes "Windows: NSIS installer + portable exe (x64). Linux: deb + AppImage, built separately for x64 and arm64. macOS: runnable .app.tar.gz for x64 and arm64 (build the dmg installer locally with npm run dist:mac).

          Builds are **unsigned**: on macOS right-click → Open the first time; on Windows accept the SmartScreen prompt.

          The app itself downloads and verifies [ipatool](https://github.com/majd/ipatool) on first launch - it is not bundled.

          This release was created as a **draft** and is not public." \
            artifacts/*
