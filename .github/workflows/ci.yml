name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Electron *binary* is irrelevant for verification; downloading it only
      # burns CI minutes and can fail on flaky mirrors.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck (main + preload + scripts)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Typecheck (renderer + shared)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
        env:
          APP_REPO: ${{ github.repository }}

      # Raw sizes are misleading (they are what V8 parses, not what ships), so
      # report both raw and gzip. One contiguous bundle per process is expected:
      # see the note in vite.config.ts about why we do not split chunks.
      - name: Report bundle sizes
        run: |
          node -e '
            const {gzipSync} = require("zlib");
            const fs = require("fs");
            const path = require("path");
            const rows = [];
            let raw = 0, gz = 0;
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) { walk(full); continue; }
                if (!/\.(js|css)$/.test(entry.name)) continue;
                const buf = fs.readFileSync(full);
                const compressed = gzipSync(buf, {level: 9});
                raw += buf.length; gz += compressed.length;
                rows.push([full, buf.length, compressed.length]);
              }
            };
            walk("dist");
            rows.sort((a, b) => b[1] - a[1]);
            const kb = (n) => (n / 1024).toFixed(1) + "K";
            const lines = [
              "## Bundle sizes", "",
              "| file | raw | gzip |", "| --- | ---: | ---: |",
              ...rows.map(([file, r, g]) => "| `" + file + "` | " + kb(r) + " | " + kb(g) + " |"),
              "| **total** | **" + kb(raw) + "** | **" + kb(gz) + "** |", "",
              "> **Note:** this workflow only verifies. Installers are built by the",
              "> **Release** workflow, which triggers on a pushed `v*` tag (or a manual",
              "> dispatch from the Actions tab). Pushing a branch never produces artifacts.",
              ""
            ];
            const table = lines.join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
            console.log(table);
          '
