# electron-builder configuration.
#
# The app ships *no* node_modules: main and preload are fully bundled by esbuild,
# so `files` only needs the bundle plus package.json. That is what keeps the
# installer near the size of the code itself rather than a Node_modules tree.
#
# ── Signing / publishing policy ─────────────────────────────────────────────
# Builds from this repository are UNSIGNED by default (no signing credentials
# in CI); Gatekeeper / SmartScreen warnings are expected and the README
# explains how to open them.
#
# ⚠️  There is deliberately NO `publish:` section. Releases are uploaded by CI
# with `gh release create`. Do NOT switch this project to electron-updater
# unless code signing (and, on macOS, notarisation) is enabled first: an
# unsigned auto-update channel is a remote-code-execution vector - whoever can
# swap latest.yml / the artifact on the feed controls what every client runs.
appId: dev.ipatoolgui.desktop
productName: IPATool GUI
copyright: Copyright © 2026 ipatool-gui contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack: []
compression: maximum

# No native modules in this project, so never attempt a rebuild.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/icon.png
  artifactName: ${name}-${version}-win-${arch}.${ext}
  # Unsigned by default. Forks with a code-signing certificate can enable it
  # WITHOUT editing this file by exporting:
  #   WIN_CSC_LINK (or CSC_LINK) = path/base64 of the .pfx
  #   CSC_KEY_PASSWORD           = certificate password
  # electron-builder picks these up automatically (signtool / Azure Trusted
  # Signing), which removes the SmartScreen / Defender-PUA friction.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IPATool GUI

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  # Unsigned by default: no `identity` is configured, so electron-builder
  # skips signing when no certificate is discoverable (the CI case).
  #
  # Forks with an Apple Developer ID certificate should export:
  #   CSC_LINK         = base64 of the Developer ID Application .p12
  #   CSC_KEY_PASSWORD = .p12 password
  # electron-builder then signs automatically. When signing, also enable the
  # hardened runtime and notarisation (required by Gatekeeper on modern macOS):
  #   -c.mac.hardenedRuntime=true -c.mac.notarize.teamId=<TEAM_ID>
  # with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD in the environment.
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Desktop front-end for ipatool
  maintainer: ipatool-gui contributors <noreply@example.com>
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: IPATool GUI
      Comment: Search the App Store and download .ipa packages via ipatool
      Terminal: false
